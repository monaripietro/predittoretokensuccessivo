name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Installa dipendenze
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit test
        run: npm run test:unit

      - name: Tokenizer reali (rete)
        run: npx vitest run tests/unit/real.test.js
        env:
          RUN_TOKENIZER_TESTS: '1'

      - name: Installa browser Playwright
        run: npx playwright install --with-deps chromium

      - name: E2E test (mock)
        run: npm run test:e2e

      - name: Carica report in caso di errore
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
