<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostica modello</title>
  <meta name="robots" content="noindex" />
  <style>
    :root { color-scheme: light dark; --bg: #fbfaf8; --fg: #1d1d1f; --muted: #5d5d66; --line: #d9d6d0; --ok: #1f7a3d; --bad: #b42318; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141416; --fg: #ececf0; --muted: #a2a2ad; --line: #34343a; --ok: #6fd28d; --bad: #ff8a80; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, "Segoe UI", sans-serif; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px 64px; }
    h1 { font-size: 1.6rem; margin: 0 0 4px; }
    p { color: var(--muted); }
    fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 16px 0; }
    label { display: inline-flex; gap: 6px; align-items: center; margin: 4px 12px 4px 0; }
    input[type=text] { width: min(100%, 520px); font: inherit; padding: 6px 8px; }
    button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: inherit; cursor: pointer; }
    pre { background: color-mix(in srgb, var(--fg) 6%, transparent); padding: 12px; border-radius: 8px; overflow: auto; font-size: 13px; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
  </style>
</head>
<body>
  <main>
    <h1>Diagnostica del modello locale</h1>
    <p>Pagina tecnica per verificare download, tempi e correttezza dei punteggi su questo dispositivo. I risultati valgono solo per questo browser e questa macchina.</p>
    <fieldset>
      <legend>Configurazione</legend>
      <label>Modello <select id="model"></select></label>
      <label>Precisione <select id="dtype"><option value="">automatica</option><option>q4f16</option><option>q4</option></select></label>
      <label>Token da generare <input id="n" type="number" min="1" max="128" value="32" /></label>
      <div><label>Prompt <input id="prompt" type="text" value="Perché il cielo è blu?" /></label></div>
      <button id="run" type="button">Carica ed esegui le misure</button>
      <button id="unload" type="button">Libera il modello</button>
    </fieldset>
    <p id="status" role="status" aria-live="polite">Pronto.</p>
    <pre id="report" data-testid="report">{}</pre>
  </main>
  <script type="module" src="./src/diagnostics.js"></script>
</body>
</html>
